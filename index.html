<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Operation: Make Her Smile</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff8fb,#17131a);--surface:light-dark(#ffffff,#211b25);--surface2:light-dark(#fff0f5,#2a222e);--text:light-dark(#2a2028,#fff4f8);--muted:light-dark(#766b73,#bbaeb8);--accent:light-dark(#d84f80,#ff78a6);--accent2:light-dark(#7656d6,#a991ff);--border:light-dark(#eadce4,#403440);--good:light-dark(#25865b,#67dba5);--shadow:0 20px 60px rgba(75,30,55,.12)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
#app{min-height:100vh;background-color:var(--bg);padding:28px 18px 48px;overflow:hidden}.wrap{max-width:760px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-weight:800;letter-spacing:.04em;font-size:14px;text-transform:uppercase;color:var(--accent)}.progress{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:28px;box-shadow:var(--shadow);padding:34px;position:relative;overflow:hidden}.glow{position:absolute;width:220px;height:220px;border-radius:50%;background:var(--accent);opacity:.08;right:-80px;top:-90px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent2);font-weight:800}.title{font-size:clamp(30px,6vw,52px);line-height:1.02;margin:10px 0 14px;letter-spacing:-.04em}.subtitle{font-size:17px;line-height:1.6;color:var(--muted);max-width:620px}.heart{font-size:48px;margin-bottom:4px;animation:pulse 1.8s infinite}.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:800;font-size:15px;cursor:pointer;background:var(--accent);color:white;transition:.18s transform,.18s opacity}.btn:hover{transform:translateY(-2px)}.btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}.puzzle{margin-top:26px}.clue{background:var(--surface2);border:1px solid var(--border);border-radius:18px;padding:18px;line-height:1.6;margin:14px 0}.inputrow{display:flex;gap:10px;margin-top:14px}.inputrow input{flex:1;min-width:0;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:14px;color:var(--text);font-size:16px;outline:none}.inputrow input:focus{border-color:var(--accent)}.feedback{min-height:24px;margin-top:12px;font-weight:700}.good{color:var(--good)}.bad{color:var(--accent)}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}.choice{padding:15px;border-radius:15px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-weight:700;cursor:pointer}.choice:hover{border-color:var(--accent)}.choice.correct{outline:2px solid var(--good)}.choice.wrong{opacity:.65}.meter{height:7px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:18px 0}.meter span{display:block;height:100%;background:var(--accent);width:0;transition:width .35s}.tiny{font-size:13px;color:var(--muted)}.final{text-align:center}.final .big{font-size:64px}.message{font-size:21px;line-height:1.65;margin:18px auto;max-width:600px}.secret{padding:18px;border-radius:18px;background:var(--surface2);font-weight:700;margin-top:20px}.mirror-message{display:inline-block;font-size:clamp(34px,9vw,72px);line-height:1.05;font-weight:900;letter-spacing:-.05em;color:var(--accent);transform:scaleX(-1);margin:22px 0;max-width:100%;word-break:break-word}.shake{animation:shake .3s}.fade{animation:fade .35s}@keyframes pulse{50%{transform:scale(1.08)}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@media(max-width:560px){.card{padding:24px;border-radius:22px}.choices{grid-template-columns:1fr}.inputrow{flex-direction:column}.btn{width:100%}}
</style>
</head>
<body>
<div id="app"><div class="wrap">
  <div class="top"><div class="brand">♡ Operation: Make Her Smile</div><div class="progress" id="progress">Ready</div></div>
  <main class="card" id="game"></main>
</div></div>
<script>
const game=document.getElementById('game'); const progress=document.getElementById('progress');
let level=0, score=0;
const puzzles=[
 {tag:'Puzzle 01 · The Warm-Up',title:'A tiny riddle',body:'I cost nothing, can be given in a second, and somehow makes a difficult day feel a little lighter. What am I?',answer:['smile','a smile'],hint:'You can give one without saying a word.'},
 {tag:'Puzzle 02 · A Name Hidden',title:'Who is it?',body:'A name is hidden here. It belongs to someone who checks up on your heart.',clue:'🐒  🦉  🌹  🧊  🍎  🌹  🌴  🧶',answer:['moriarty','m o r i a r t y'],hint:'Someone from the hospital might recognise the clue.'},
 {tag:'Puzzle 03 · The Odd One Out',title:'Which one does not belong?',body:'Three of these are things you can share. One is usually better kept to yourself.',choices:['A laugh','A secret','A smile','A good story'],correct:1},
 {tag:'Puzzle 04 · A Message Hidden',title:'A little reminder',body:'Some messages are not meant to be decoded — they are meant to be felt.',clue:'<b>Vkxgdb, brxu kdsslqhv phdqv d orw.</b>',answer:['shreya your happiness means a lot']},
 {tag:'Puzzle 05 · The Mind Palace',title:'A Message from Sherlock',body:'Open the BBC Sherlock scene where Molly introduces Sherlock to her “boyfriend” Jim. This time, Sherlock has left you a coded question.',clue:'<b>-- --- .-- / -- .- -. -.-- / .--. --- ..- -. -.. ... / -.. .. -.. / ... .... . .-. .-.. --- -.-. -.- / -.. . -.. ..- -.-. . - / - .... .- - / -- --- .-.. .-.. -.-- / .... .- -.. / .-.. --- ... - / .- ..-. - . . .-. / ... .... . / .. -. - .-. --- -.. ..- -.-. . -.. / .--- .. -- / ..-. --- .-. / - .... . / ..-. .. .-. ... - / - .. -- . ..--..</b><br><br>Decode the Morse code, then watch the scene to confirm the answer.',answer:['3','three','3 pounds','three pounds'],hint:'Look for Sherlock’s comment about Molly’s weight immediately after Jim leaves.'},
 {tag:'Puzzle 06 · Final Reveal',title:'One last instruction.',body:'You made it through the case. There is no answer to type here. Just follow the instruction below, then press the button.',clue:'<b>Case closed… for now.</b><br><br>Put your phone screen in front of a mirror. Then press <b>Reveal the message</b> and read what appears.',answer:[],hint:'No answer is required for this final puzzle.'}
];
function shell(p){progress.textContent=`Puzzle ${level+1} of ${puzzles.length}`;game.className='card fade';game.innerHTML=`<div class="glow"></div><div class="eyebrow">${p.tag}</div><div class="title">${p.title}</div><div class="subtitle">${p.body}</div><div class="meter"><span style="width:${(level/puzzles.length)*100}%"></span></div><div class="puzzle" id="puzzle"></div>`}
function render(){if(level>=puzzles.length){finish();return} const p=puzzles[level]; shell(p); const el=document.getElementById('puzzle');
 if(p.choices){el.innerHTML=`<div class="clue">${p.clue||''}</div><div class="choices">${p.choices.map((x,i)=>`<button class="choice" onclick="choose(${i})">${x}</button>`).join('')}</div><div class="feedback" id="feedback"></div>`}
 else if(level===5){el.innerHTML=`${p.clue?`<div class="clue">${p.clue}</div>`:''}<button class="btn" onclick="revealMirrorMessage()">Reveal the message</button><div id="mirrorReveal"></div>`}
 else {el.innerHTML=`${p.clue?`<div class="clue">${p.clue}</div>`:''}<div class="inputrow"><input id="answer" autocomplete="off" placeholder="Type your answer…"><button class="btn" onclick="check()">Unlock</button></div><div class="feedback" id="feedback"></div>`;document.getElementById('answer').addEventListener('keydown',e=>{if(e.key==='Enter')check()})}}
function revealMirrorMessage(){document.getElementById('mirrorReveal').innerHTML='<div class="mirror-message">YOUR SMILE IS WORTH EVERYTHING. ♡</div><div class="tiny">Now hold your phone in front of a mirror to read it normally. ♡</div><div class="actions"><button class="btn" onclick="level++;render()">Continue</button></div>'}
function norm(x){return x.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim()}
function check(){const p=puzzles[level],v=norm(document.getElementById('answer').value),f=document.getElementById('feedback');if(!v){f.textContent='Give it a shot ✨';return} if(p.answer.some(a=>norm(a)===v)|| (level===5 && ['bad mad glad','mad bad glad'].includes(v))){score++;f.className='feedback good';f.textContent=level===6?'That answer is worth more than any points. ❤️':'Correct. You found the next door.';setTimeout(()=>{level++;render()},850)}else{f.className='feedback bad';f.textContent='Not quite. Try another angle — you’re close.';document.getElementById('puzzle').classList.add('shake');setTimeout(()=>document.getElementById('puzzle').classList.remove('shake'),350)}}
function choose(i){const p=puzzles[level],f=document.getElementById('feedback');document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===p.correct)b.classList.add('correct')});if(i===p.correct){score++;f.className='feedback good';f.textContent='Correct. Nicely spotted. ✨';setTimeout(()=>{level++;render()},850)}else{document.querySelectorAll('.choice')[i].classList.add('wrong');f.className='feedback bad';f.textContent=p.explain||'Nope — but that was a good attempt. Try again.';document.querySelectorAll('.choice').forEach(b=>b.disabled=false)}}
function finish(){progress.textContent='Mission complete';game.className='card final fade';game.innerHTML=`<div class="big">🌙✨</div><div class="eyebrow">You made it</div><div class="title">The puzzles were never the point.</div><div class="message">If this little game managed to steal even <b>two minutes</b> from a bad day, then it did its job.<br><br>And if the person you made it for is reading this: <b>you don't have to solve everything today.</b> Take a breath. Eat something. Rest. Talk to someone. Let tomorrow handle some of it.</div><div class="secret">P.S. Someone out there thought you deserved a tiny adventure today. ♡</div><div class="actions"><button class="btn" onclick="restart()">Play again</button><button class="btn secondary" onclick="reveal()">Reveal a secret</button></div><div id="secret2"></div>`}
function reveal(){document.getElementById('secret2').innerHTML='<div class="secret fade">Secret unlocked: <span style="color:var(--accent)">You are allowed to have bad days without becoming a bad person.</span></div>'}
function restart(){level=0;score=0;render()} render();
</script></body></html>
